<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Simulador Agronomía y Biología</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --border:#2a2f3a;
    --accent:#2ecc71; --accent2:#3b82f6; --red:#ef4444; --text:#e6edf3; --muted:#8b949e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:linear-gradient(160deg,#0d1117,#131a24);
    color:var(--text); min-height:100vh; padding:24px 12px;
  }
  .wrap{max-width:720px; margin:0 auto;}
  h1{font-size:1.4rem; text-align:center; margin-bottom:4px; color:#fff;}
  .subtitle{text-align:center; color:var(--muted); font-size:.9rem; margin-bottom:20px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:20px; margin-bottom:16px; box-shadow:0 4px 20px rgba(0,0,0,.3);
  }
  .progress-bar{
    width:100%; height:8px; background:#21262d; border-radius:5px; overflow:hidden; margin-bottom:20px;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent));
    width:0%; transition:width .3s ease;
  }
  .qnum{color:var(--accent2); font-weight:600; font-size:.85rem; margin-bottom:8px;}
  .qtext{font-size:1.05rem; line-height:1.5; margin-bottom:18px; color:#fff;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .option{
    background:#1c2330; border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; cursor:pointer; transition:.15s; font-size:.95rem; line-height:1.4;
    display:flex; gap:10px; align-items:flex-start;
  }
  .option:hover{border-color:var(--accent2); background:#212a3a;}
  .option.selected{border-color:var(--accent2); background:#1a2a42;}
  .option.correct{border-color:var(--accent); background:#123024; color:#c9f7d9;}
  .option.incorrect{border-color:var(--red); background:#3a1418; color:#ffd0d0;}
  .option.disabled{cursor:default; pointer-events:none;}
  .letter{
    flex-shrink:0; width:24px; height:24px; border-radius:6px; background:#2a2f3a;
    display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700;
  }
  .feedback{
    margin-top:16px; padding:12px 14px; border-radius:10px; font-size:.9rem; display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:#123024; color:#8ff0b6; border:1px solid var(--accent);}
  .feedback.bad{background:#3a1418; color:#ffb3b3; border:1px solid var(--red);}
  .nav{display:flex; justify-content:flex-end; margin-top:18px;}
  button{
    background:var(--accent2); color:#fff; border:none; padding:11px 22px;
    border-radius:9px; font-size:.95rem; cursor:pointer; font-weight:600;
    transition:.15s;
  }
  button:hover{opacity:.85;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  #startBtn{display:block; margin:20px auto 0; background:var(--accent);}
  .result-title{font-size:1.6rem; text-align:center; margin-bottom:6px;}
  .score{font-size:2.6rem; text-align:center; font-weight:800; margin:10px 0; color:var(--accent);}
  .score.low{color:var(--red);}
  .score.mid{color:#f5a623;}
  .review-item{
    border-left:3px solid var(--border); padding:10px 14px; margin-bottom:10px; border-radius:6px; background:#1c2330;
  }
  .review-item.ok{border-color:var(--accent);}
  .review-item.bad{border-color:var(--red);}
  .review-q{font-size:.88rem; color:var(--muted); margin-bottom:4px;}
  .review-a{font-size:.92rem;}
  .center{text-align:center;}
  #retryBtn{margin-top:20px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌱 Simulador: Fundamentos de Agronomía y Biología</h1>
  <p class="subtitle">10 preguntas aleatorias tomadas de un banco de 82</p>

  <div id="intro" class="card center">
    <p>Cada intento genera 10 preguntas al azar (y opciones desordenadas). Al responder verás de inmediato si acertaste.</p>
    <button id="startBtn">Comenzar simulador</button>
  </div>

  <div id="quizArea" class="hidden">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="card">
      <div class="qnum" id="qnum"></div>
      <div class="qtext" id="qtext"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="nav"><button id="nextBtn" disabled>Siguiente</button></div>
    </div>
  </div>

  <div id="resultArea" class="hidden">
    <div class="card center">
      <div class="result-title">Resultado</div>
      <div class="score" id="scoreText"></div>
      <div id="scoreMsg" style="color:var(--muted);"></div>
      <button id="retryBtn">Intentar de nuevo</button>
    </div>
    <div id="reviewList"></div>
  </div>
</div>

["Los principios de agroecología promueven:",["Diversificación, reciclaje de nutrientes y eficiencia energética.","Uso intensivo de insumos sintéticos.","Reducción de la biodiversidad.","Deforestación progresiva."],0],
["Los sistemas pecuarios inteligentes aplican IoT para:",["Reducir la productividad.","Incrementar el confinamiento animal.","Controlar temperatura, alimentación y salud del rebaño en tiempo real.","Eliminar la supervisión veterinaria."],2],
["Un ejemplo de economía circular dentro de un sistema agropecuario es:",["Incinerar los residuos sin recuperación energética.","Reincorporar subproductos agrícolas al suelo como fuente de nutrientes orgánicos.","Exportar todos los residuos agrícolas para reducir carga local.","Comprar fertilizantes importados para compensar pérdidas."],1],
["Un país con alta producción agrícola pero bajo poder adquisitivo de la población enfrenta inseguridad alimentaria por falta de:",["Estabilidad.","Utilización.","Disponibilidad.","Acceso."],3],
["Un principio fundamental de la agroecología es:",["Usar los recursos naturales de manera sostenible y cíclica.","Sustituir recursos renovables por químicos industriales.","Priorizar la rentabilidad sobre la conservación del suelo.","Incrementar el uso de fertilizantes sintéticos."],0],
["Un sistema que mantiene disponibilidad y acceso pero falla en inocuidad alimentaria afecta el componente de:",["Acceso.","Utilización.","Disponibilidad.","Estabilidad."],1]
];

const LETTERS = ['A','B','C','D'];
let quiz = [];
let current = 0;
let score = 0;
let answered = false;
let review = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildQuiz(){
  const chosen = shuffle(BANK).slice(0,10);
  quiz = chosen.map(item=>{
    const [q, opts, correctIdx] = item;
    const correctText = opts[correctIdx];
    const order = shuffle(opts.map((o,i)=>i));
    const newOpts = order.map(i=>opts[i]);
    const newCorrect = newOpts.indexOf(correctText);
    return {q, options:newOpts, correct:newCorrect};
  });
}

function startQuiz(){
  buildQuiz();
  current = 0; score = 0; review = [];
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const q = quiz[current];
  document.getElementById('progressFill').style.width = ((current)/quiz.length*100)+'%';
  document.getElementById('qnum').textContent = `Pregunta ${current+1} de ${quiz.length}`;
  document.getElementById('qtext').textContent = q.q;
  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  q.options.forEach((opt, idx)=>{
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="letter">${LETTERS[idx]}</span><span>${opt}</span>`;
    div.onclick = ()=>selectOption(idx);
    optsDiv.appendChild(div);
  });
  document.getElementById('feedback').classList.remove('show','ok','bad');
  document.getElementById('feedback').textContent = '';
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = true;
  nextBtn.textContent = current === quiz.length-1 ? 'Ver resultado' : 'Siguiente';
  nextBtn.onclick = ()=>{
    if(current < quiz.length-1){
      current++;
      renderQuestion();
    } else {
      showResult();
    }
  };
}

function selectOption(idx){
  if(answered) return;
  answered = true;
  const q = quiz[current];
  const options = document.querySelectorAll('.option');
  const isCorrect = idx === q.correct;
  options.forEach((el,i)=>{
    el.classList.add('disabled');
    if(i === q.correct) el.classList.add('correct');
    if(i === idx && !isCorrect) el.classList.add('incorrect');
    if(i === idx) el.classList.add('selected');
  });
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok':'bad');
  fb.textContent = isCorrect
    ? '✅ ¡Correcto!'
    : `❌ Incorrecto. La respuesta correcta es: ${LETTERS[q.correct]}) ${q.options[q.correct]}`;
  if(isCorrect) score++;
  review.push({q:q.q, chosen:q.options[idx], correctText:q.options[q.correct], isCorrect});
  document.getElementById('nextBtn').disabled = false;
}

function showResult(){
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('resultArea').classList.remove('hidden');
  const scoreEl = document.getElementById('scoreText');
  scoreEl.textContent = `${score} / ${quiz.length}`;
  scoreEl.className = 'score ' + (score>=8?'':score>=5?'mid':'low');
  const pct = Math.round(score/quiz.length*100);
  document.getElementById('scoreMsg').textContent =
    pct>=80 ? `¡Excelente! ${pct}% de aciertos.` :
    pct>=50 ? `Vas bien, ${pct}% de aciertos. Sigue repasando.` :
    `${pct}% de aciertos. Conviene repasar el material.`;

  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '<div class="card"><strong>Repaso de respuestas</strong></div>';
  review.forEach((r, i)=>{
    const div = document.createElement('div');
    div.className = 'review-item ' + (r.isCorrect?'ok':'bad');
    div.innerHTML = `
      <div class="review-q">${i+1}. ${r.q}</div>
      <div class="review-a">${r.isCorrect ? '✅' : '❌'} Tu respuesta: ${r.chosen}${r.isCorrect?'':`<br>✔️ Correcta: ${r.correctText}`}</div>
    `;
    reviewList.appendChild(div);
  });
}

document.getElementById('startBtn').onclick = startQuiz;
document.getElementById('retryBtn').onclick = startQuiz;
</script>
